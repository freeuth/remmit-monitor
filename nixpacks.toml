[phases.setup]
nixPkgs = ["nodejs_20", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa", "libX11", "libXcomposite", "libXdamage", "libXext", "libXfixes", "libXrandr", "pango", "cairo", "alsa-lib"]

[phases.install]
cmds = ["npm ci", "npx playwright install chromium"]

[phases.build]
cmds = ["npx prisma generate", "npx prisma migrate deploy", "npm run build"]

[start]
cmd = "node .next/standalone/server.js"

[variables]
DATABASE_URL = "file:/app/data/prod.db"
PLAYWRIGHT_BROWSERS_PATH = "/root/.cache/ms-playwright"
